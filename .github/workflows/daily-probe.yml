# Tạm thời: dò nguồn / AI / giọng đọc cho app MMH Daily (xoá sau khi chuyển sang kho riêng).
name: Dò MMH Daily
on:
  push:
    branches: ['claude/health-policy-news-aggregator-gvxs88']
    paths: ['daily/tools/probe.mjs', '.github/workflows/daily-probe.yml']
permissions: { contents: read, models: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node daily/tools/probe.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Giọng đọc edge-tts
        run: |
          pip install -q edge-tts && edge-tts --list-voices | grep -E "en-(US|GB|AU)" | grep -iE "Neural" | head -40
          edge-tts --voice en-US-AndrewMultilingualNeural --text "Good morning. This is the M M H Daily Brief for Sunday, November eighth." --write-media /tmp/t.mp3 --write-subtitles /tmp/t.vtt && ls -la /tmp/t.mp3 && head -20 /tmp/t.vtt
          ffmpeg -version | head -1; ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/t.mp3
      - name: Piper (dự phòng)
        run: |
          pip install -q piper-tts && python3 -m piper.download_voices en_US-lessac-medium 2>&1 | tail -2 || true
          echo "Hello from piper." | python3 -m piper -m en_US-lessac-medium -f /tmp/p.wav 2>&1 | tail -2; ls -la /tmp/p.wav || true
