<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theo dõi gói thầu · MMH</title>
<link rel="icon" href="../map/app/favicon-32.png">
<link rel="apple-touch-icon" href="../map/app/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003047">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:Aptos;src:local(Aptos),local(Aptos-Regular);font-weight:100 500}
@font-face{font-family:Aptos;src:local('Aptos Semibold'),local(Aptos-SemiBold);font-weight:600}
@font-face{font-family:Aptos;src:local('Aptos Bold'),local(Aptos-Bold);font-weight:700 900}
:root{
  --ff:Aptos,'Segoe UI',system-ui,-apple-system,sans-serif;
  --navy:#003047;--blue:#3A5CAA;--sky:#5188CC;--lb:#CFE2F3;--pale:#F0F7FF;
  --bg:#F4F7FB;--sf:#fff;--sf2:#F7F9FC;--line:#E6EAEF;--line2:#D5DDE8;--fld:#C3CDD8;
  --t1:#0F2537;--t2:#55667D;--t3:#5F6E84;
  --ok:#2E7D32;--warn:#C77700;--bad:#B42318;--mute:#98A2B3;
  --kh:#6D28D9;--tb:#C77700;--kq:#2E7D32;--r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
.top{display:flex;align-items:center;gap:10px 14px;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:17px;color:var(--navy)}
.brand span{font-size:12px;color:var(--t2)}
.who{font-size:13px;color:var(--t2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--sf);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line2);background:var(--sf);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--navy)}
.btn:hover{border-color:var(--sky);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#2F4F96}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.dng{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font-weight:600}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.card>h3{margin:0;padding:12px 16px;font-size:15px;color:var(--navy);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 .sp{margin-left:auto}
.wl{list-style:none;margin:0;padding:6px 0}
.wl li{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.wl li:last-child{border-bottom:0}
.wl li:hover{background:var(--sf2)}
.wl li.on{background:var(--pale);box-shadow:inset 3px 0 0 var(--blue)}
.wl .nm{font-weight:600;color:var(--navy);display:flex;gap:8px;align-items:baseline}
.wl .nm .n{margin-left:auto;font-size:12px;color:var(--t2);font-weight:500;white-space:nowrap}
.wl .meta{font-size:12px;color:var(--t2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wl .off{opacity:.55}
.tg{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.tg.khmt{color:var(--kh);border-color:#D9CCF7;background:#F6F2FE}
.tg.tbmt{color:var(--tb);border-color:#F2D9B0;background:#FFF8EC}
.tg.kqdt{color:var(--kq);border-color:#C6E2C8;background:#F1F8F1}
.empty{padding:22px 16px;color:var(--t2);font-size:13px;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sf);padding:6px 12px;cursor:pointer;color:var(--t2);font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pale);color:var(--blue)}
.inp{border:1px solid var(--fld);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,92,170,.15)}
select.inp{padding-right:28px}
.q{flex:1;min-width:160px}
.hits{list-style:none;margin:0;padding:0}
.hit{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:92px 1fr auto;gap:4px 14px}
.hit:last-child{border-bottom:0}
.hit.hl{background:#FFFBEA}
.hit .d{font-size:12.5px;color:var(--t2);padding-top:2px}
.hit .t{font-weight:600;color:var(--t1);line-height:1.35}
.hit .s{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.45}
.hit .s b{color:var(--t1);font-weight:600}
.hit .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line2);white-space:nowrap}
.st.done{color:var(--ok);border-color:#C6E2C8;background:#F1F8F1}
.st.wait,.st.work{color:var(--blue);border-color:var(--lb);background:var(--pale)}
.st.err{color:var(--bad);border-color:#F3C9C4;background:#FEF3F2}
.st.nofile,.st.off{color:var(--t2)}
.files{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.files a{max-width:100%;overflow-wrap:anywhere;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:12.5px;text-decoration:none;background:var(--sf2)}
.files a:hover{border-color:var(--sky)}
.no{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--navy)}
.more{padding:12px 16px;text-align:center}
.note{font-size:12.5px;color:var(--t3);padding:8px 16px}
.err{background:#FEF3F2;border:1px solid #F3C9C4;color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 16px;font-size:13px}
/* hộp thoại */
.ov{position:fixed;inset:0;background:rgba(15,37,55,.35);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:50;overflow:auto}
.ov.show{display:flex}
.dlg{background:var(--sf);border-radius:14px;width:560px;max-width:100%;border:1px solid var(--line2);box-shadow:0 18px 44px rgba(0,48,71,.18)}
.dlg h4{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px;color:var(--navy)}
.dlg .bd{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.dlg .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg .ft .msg{margin-right:auto;font-size:12.5px;color:var(--bad)}
.lb{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.hint{font-size:12px;color:var(--t3);margin-top:5px;line-height:1.45}
.sugg{border:1px solid var(--line2);border-radius:8px;max-height:260px;overflow:auto;margin-top:6px;display:none}
.sugg.show{display:block}
.sugg button{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:8px 10px;cursor:pointer;gap:8px;align-items:baseline}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.kb{background:var(--pale)}
.sugg .c{margin-left:auto;font-size:11.5px;color:var(--t2);white-space:nowrap}
.picked{display:flex;gap:8px;align-items:center;border:1px solid var(--lb);background:var(--pale);border-radius:8px;padding:8px 10px;font-weight:600;color:var(--navy)}
.picked .lnk{margin-left:auto;font-weight:500}
.ck{display:flex;gap:8px;flex-wrap:wrap}
.ck label{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}
.ck label.on{border-color:var(--blue);background:var(--pale)}
.ck input{margin:0}
.tog{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tog input{margin-top:3px}
.tog small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
.key{font-family:ui-monospace,Consolas,monospace;background:var(--sf2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:12.5px}
/* đăng nhập */
.gate{max-width:420px;margin:10vh auto;padding:0 16px}
.gate .card{padding:22px}
.gate h2{margin:0 0 4px;color:var(--navy);font-size:20px}
.gate p{color:var(--t2);margin:0 0 16px;font-size:13.5px;line-height:1.5}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate .alt{margin-top:12px;font-size:13px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.quick{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.quick textarea{flex:1;min-width:220px;height:40px;resize:vertical;border:1px solid var(--fld);border-radius:8px;padding:8px 10px;font:13px ui-monospace,Consolas,monospace}
.quick textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,92,170,.15)}
.quick .hint{flex-basis:100%;margin:0}
.ag{grid-column:2/4;font-size:12.5px;color:var(--t2);margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.ag b{color:var(--t1);font-weight:600}
.tabs{display:inline-flex;gap:2px;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,48,71,.12)}
.tn{font-size:11px;font-weight:700;background:var(--lb);color:var(--navy);border-radius:999px;padding:0 6px;line-height:17px}
.mwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto;align-items:start}
.mapc{position:sticky;top:12px}
.mbar{border-bottom:0}
.msum{margin-left:auto;font-size:13px;color:var(--t2)}
.msum b{color:var(--navy)}
#vnmap{display:block;width:100%;height:calc(100vh - 190px);min-height:420px;max-height:820px}
#vnmap .pv{stroke:#fff;stroke-width:1.1;cursor:pointer;transition:opacity .15s}
#vnmap .pv:hover{opacity:.82}
#vnmap .pv.on{stroke:var(--navy);stroke-width:2.4}
#vnmap .lb{cursor:pointer}
#vnmap .lb text{font:700 14px var(--ff);fill:var(--navy);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
#vnmap .lb.dk text{fill:#fff;stroke:#1F4E8C}
#vnmap .wdot{fill:#C77700;stroke:#fff;stroke-width:1.5}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--t2);padding:6px 16px 12px;flex-wrap:wrap}
.lgr{width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#DCE6F2,#1F4E8C)}
.wdot2{width:9px;height:9px;border-radius:50%;background:#C77700;margin-left:10px}
.pvp>h3{margin:0;padding:12px 16px;font-size:16px;color:var(--navy);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pvp>h3 .sub{font-size:12.5px;font-weight:500;color:var(--t2)}
.pvp>h3 .sp{margin-left:auto}
.invl{list-style:none;margin:0;padding:0;max-height:calc(100vh - 250px);overflow:auto}
.invl li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.invl .in{min-width:0;flex:1}
.invl .in b{display:block;color:var(--t1);font-weight:600;overflow-wrap:anywhere}
.invl .ic{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--t2)}
.invl .lt{color:var(--t3)}
.btn.wok{color:var(--ok);border-color:#C6E2C8;background:#F1F8F1}
.dwrap{padding:16px 20px;max-width:1300px;margin:0 auto}
.dl{list-style:none;margin:0;padding:0}
.dl>li{padding:12px 16px;border-bottom:1px solid var(--line)}
.dl .dh{display:flex;gap:8px;align-items:baseline}
.dl .dh b{color:var(--t1);line-height:1.35}
.dl .s{font-size:12.5px;color:var(--t2);margin:4px 0 8px}
.dfs{display:flex;gap:6px;flex-wrap:wrap}
.dfs a{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;text-decoration:none;background:var(--sf2);max-width:100%;overflow-wrap:anywhere}
.dfs a:hover{border-color:var(--sky)}
.dfs a small{color:var(--t3);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px 0;max-width:1500px;margin:0 auto}
.tile{border:1px solid var(--line);background:var(--sf);border-radius:var(--r);padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:22px;color:var(--navy);line-height:1.1}
.tile span{font-size:12.5px;color:var(--t2)}
.tile:hover{border-color:var(--sky)}
.tile.on{border-color:var(--blue);background:var(--pale)}
.wl .nm .nmt{min-width:0;overflow-wrap:anywhere}
.wl .meta .ed{margin-left:auto}
.files{flex-direction:column;gap:6px}
.fg{display:flex;gap:8px;align-items:flex-start}
.fgl{flex:none;width:96px;font-size:11.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;padding-top:6px}
.fgf{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.fx{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid var(--line2);color:var(--t2);background:#fff}
.fx.gs{color:var(--kq);border-color:#C6E2C8}
.fx.pdf{color:var(--bad);border-color:#F3C9C4}
.agf{display:inline-flex;gap:6px;align-items:center;border:1px dashed var(--line2);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--t2)}
.agf small{font-size:11px;color:var(--warn);font-weight:600}
.sm2{font-size:12.5px;font-weight:600;text-decoration:none}
.pwrow{display:flex;gap:6px}
.pwrow .inp{flex:1}
.eye{border:1px solid var(--fld);background:#fff;border-radius:8px;padding:0 12px;cursor:pointer;color:var(--t2);font-size:12.5px}
.acl{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:12px}
  .wrap>*{min-width:0}
  .stats{grid-template-columns:repeat(2,1fr);padding:12px 12px 0;gap:8px}
  .tabs{order:5;width:100%;display:flex}
  .tabs button{flex:1;justify-content:center;padding:7px 6px;white-space:nowrap}
  #vnmap .lb text{font-size:21px;stroke-width:4px}
  #vnmap .wdot{r:7px}
  .brand span{display:none}
  .mwrap{grid-template-columns:minmax(0,1fr);padding:12px;gap:12px}
  .mapc{position:static}
  #vnmap{height:62vh;min-height:360px}
  .invl{max-height:none}
  .dwrap{padding:12px}
  .tile b{font-size:19px}
  .side .wl{display:flex;align-items:flex-start;overflow-x:auto;gap:8px;padding:10px 12px;scroll-snap-type:x proximity}
  .side .wl li{flex:none;width:230px;border:1px solid var(--line);border-radius:10px;scroll-snap-align:start}
  .side .wl li.on{box-shadow:none;border-color:var(--blue)}
  .fg{flex-direction:column;gap:4px}
  .fgl{width:auto;padding-top:0}
  .top{padding:10px 14px}
  .hit{grid-template-columns:1fr;gap:4px}
  .hit .r{flex-direction:row;align-items:center;justify-content:flex-start;text-align:left}
  .files,.ag{grid-column:1}
  .hit>*{min-width:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>
<script>
/* MMH · Theo dõi gói thầu v1.2 (18/11/2026) — danh sách bệnh viện lưu sẵn trên máy, tạo mật khẩu sau lần đầu đăng nhập bằng mã,
   hồ sơ chia theo TBMT / KQLCNT / KHLCNT + link thư mục Drive và Sheet tổng hợp.
   v1.0 (17/11/2026)
   Người dùng tự chọn chủ đầu tư (bệnh viện) + loại tin cần theo dõi ⇒ backend tender-info (MMH_Watch.gs) quét 3 tab của file
   "MMH FY 67_ Tender Information" (dữ liệu Báo Đấu Thầu hằng ngày) ⇒ gói mới ⇒ thông báo + bot tải hồ sơ từ muasamcong về Drive.
   Đăng nhập: phiên email công ty (localStorage.mmh_tk — dùng chung Report Hub / CRM / Tender Map). */
var API = "https://script.google.com/macros/s/AKfycbwv3R7EACqtt3pQZfMWRQFilC4E0W7td8Z8xWxQW6P7UckqFjWFJSFxcOWBZknHplhQuQ/exec";
var TRAINING_HUB = "https://script.google.com/macros/s/AKfycbwsX4cQEoH4LNlmcNfe8qWIM9K6EiDEXy7PjhP9bHY2citL6xHn5L1unsAlQJHyL9EP/exec";
var VER = "1.3";
var TYPES = { khmt: "Kế hoạch LCNT", tbmt: "Thông báo mời thầu", kqdt: "Kết quả LCNT" };
var TSHORT = { khmt: "KH LCNT", tbmt: "TBMT", kqdt: "Kết quả" };
var STC = { "Chờ tải": "wait", "Đang tải": "work", "Đã tải": "done", "Lỗi": "err", "Không có file": "nofile", "Không tải": "off" };
var S = { boot: null, inv: null, sel: "", type: "", st: "", q: "", lim: 60, busy: false, err: "", hl: "", tab: "map", prov: -1, dq: "", dsec: "" };
try { S.tab = localStorage.getItem("wt_tab") || "map"; } catch (_) {}
var lg = { step: "pw", email: "", busy: false, err: "" };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fold(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d"); }
function qs(o){ return Object.keys(o).map(function(k){ return encodeURIComponent(k) + "=" + encodeURIComponent(o[k] == null ? "" : o[k]); }).join("&"); }
function toast(t){ var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove("show"); }, 3200); }
function dmy(iso){ var m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + "/" + m[2] + "/" + m[1] : (iso || ""); }

/* ── gọi máy chủ: fetch không kèm cookie Google (tránh trang "chọn tài khoản"), hết giờ 60 giây ── */
function call(url, params, post){
  var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if (ctl) ctl.abort(); }, 60000);
  var p = post ? fetch(url, { method: "POST", body: new URLSearchParams(params), redirect: "follow", credentials: "omit", signal: ctl ? ctl.signal : undefined })
               : fetch(url + "?" + qs(params), { redirect: "follow", credentials: "omit", signal: ctl ? ctl.signal : undefined });
  return p.then(function(r){ clearTimeout(to); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }, function(e){ clearTimeout(to); throw new Error(e.name === "AbortError" ? "máy chủ trả lời quá lâu" : e.message); });
}

  F.msg = ""; F.busy = false; paintForm(); $("ov").classList.add("show");
  loadInv(function(){ if (F && !F.investor) paintSugg(); });
  setTimeout(function(){ var q = $("w-q"); if (q) q.focus(); }, 60);
}
function paintForm(){
  var h = '<h4>' + (F.id ? "Sửa theo dõi" : "Thêm theo dõi") + '</h4><div class="bd"><div><span class="lb">Chủ đầu tư / bệnh viện</span>';
  if (F.investor) h += '<div class="picked">' + esc(F.investor) + (F.id ? "" : '<button class="lnk" data-f="repick">Chọn lại</button>') + '</div>';
  else h += '<input class="inp" id="w-q" style="width:100%" placeholder="Gõ tên, vd. mắt trung ương, mắt hà nội…" autocomplete="off"><div class="sugg" id="w-sugg"></div><div class="hint">Danh sách lấy từ dữ liệu thầu hằng ngày (Báo Đấu Thầu). Số bên phải = số tin đã có: KH LCNT · TBMT · Kết quả.</div>';
  h += '</div><div><span class="lb">Loại tin cần theo dõi</span><div class="ck">' + Object.keys(TYPES).map(function(t){ var on = F.types.indexOf(t) >= 0; return '<label class="' + (on ? "on" : "") + '"><input type="checkbox" data-t="' + t + '"' + (on ? " checked" : "") + '>' + TYPES[t] + '</label>'; }).join("") + '</div></div>' +
    '<div><span class="lb">Từ khoá trong tên gói (không bắt buộc)</span><input class="inp" id="w-kw" style="width:100%" placeholder="vd. dao; chỉ khâu; vật tư nhãn khoa" value="' + esc(F.keywords) + '"><div class="hint">Để trống = mọi gói của chủ đầu tư này. Nhiều từ khoá cách nhau bằng dấu ;</div></div>' +
    '<label class="tog"><input type="checkbox" id="w-dl"' + (F.dl ? " checked" : "") + '><span><b>Tự tải hồ sơ</b><small>Bot tải Thông báo mời thầu / Hồ sơ mời thầu / file Excel kết quả từ muasamcong về Drive.</small></span></label>' +
    '<label class="tog"><input type="checkbox" id="w-em"' + (F.email ? " checked" : "") + '><span><b>Gửi email khi có tin mới</b><small>Luôn có thông báo ở nút "Nhắc tôi" của Report Hub / CRM.</small></span></label>' +
    (F.id ? '<label class="tog"><input type="checkbox" id="w-ac"' + (F.active ? " checked" : "") + '><span><b>Đang theo dõi</b><small>Bỏ chọn để tạm dừng.</small></span></label>' : "") +
    '</div><div class="ft"><span class="msg">' + esc(F.msg) + '</span>' + (F.id ? '<button class="btn dng" data-f="del">' + (F.askDel ? "Bấm lần nữa để xoá" : "Xoá") + '</button>' : "") +
    '<button class="btn" data-f="close">Đóng</button><button class="btn pri" data-f="save"' + (F.busy ? " disabled" : "") + '>' + (F.busy ? "Đang lưu…" : "Lưu") + '</button></div>';
  $("dlg").innerHTML = h;
  var q = $("w-q"); if (q) { q.oninput = paintSugg; q.onkeydown = suggKey; }
}
function paintSugg(){
  var box = $("w-sugg"), q = $("w-q"); if (!box || !q) return;
  if (!S.inv) { box.innerHTML = '<div class="note">Đang tải danh sách chủ đầu tư…</div>'; box.classList.add("show"); return; }
  var t = fold(q.value).trim(), words = t.split(/\s+/).filter(String);
  var L = S.inv.filter(function(r){ var f = fold(r[0]); return words.every(function(w){ return f.indexOf(w) >= 0; }); }).slice(0, 40);
  if (!t) L = S.inv.filter(function(r){ return /mat/.test(fold(r[0])); }).slice(0, 15);
  box.innerHTML = L.length ? L.map(function(r, i){ return '<button type="button" data-pick="' + esc(r[0]) + '"' + (i === 0 ? ' class="kb"' : "") + '><span>' + esc(r[0]) + (r[5] ? ' <span style="color:var(--t3);font-size:12px">· ' + esc(r[5]) + '</span>' : "") + '</span><span class="c">' + r[1] + " · " + r[2] + " · " + r[3] + '</span></button>'; }).join("")
    : '<div class="note">Không thấy "' + esc(q.value) + '" trong dữ liệu thầu. Vẫn theo dõi tên này: <button class="lnk" data-pick="' + esc(q.value.trim()) + '">Dùng tên đã gõ</button></div>';
  box.classList.add("show");
}
function suggKey(e){
  var box = $("w-sugg"); if (!box) return; var b = [].slice.call(box.querySelectorAll("button[data-pick]")), i = b.findIndex(function(x){ return x.classList.contains("kb"); });
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (i >= 0) b[i].classList.remove("kb"); i = (i + (e.key === "ArrowDown" ? 1 : -1) + b.length) % b.length; if (b[i]) { b[i].classList.add("kb"); b[i].scrollIntoView({ block: "nearest" }); } }
  if (e.key === "Enter" && b[Math.max(0, i)]) { e.preventDefault(); pick(b[Math.max(0, i)].getAttribute("data-pick")); }
}
function pick(name){ if (!name) return; F.investor = name; paintForm(); }
function readForm(){
  var kw = $("w-kw"); if (kw) F.keywords = kw.value;
  var dl = $("w-dl"); if (dl) F.dl = dl.checked;
  var em = $("w-em"); if (em) F.email = em.checked;
  var ac = $("w-ac"); if (ac) F.active = ac.checked;
}
function saveForm(){
  readForm();
  if (!F.investor) { F.msg = "Chọn chủ đầu tư."; paintForm(); return; }
  if (!F.types.length) { F.msg = "Chọn ít nhất 1 loại tin."; paintForm(); return; }
  F.busy = true; F.msg = ""; paintForm();
  var w = { id: F.id, investor: F.investor, types: F.types, keywords: F.keywords.split(/[;\n]/).map(function(s){ return s.trim(); }).filter(String), dl: F.dl, email: F.email, active: F.active };
  api("wSave", { w: JSON.stringify(w) }, true).then(function(d){
    if (!d || !d.ok) { F.busy = false; F.msg = (d && d.error) || "Chưa lưu được."; paintForm(); return; }
    S.boot = d; try { localStorage.setItem("wt_boot1", JSON.stringify(d)); } catch (_) {}
    S.sel = d.saved || ""; close_(); render();
    var sc = d.scan || {}; toast(sc.added ? "Đã lưu · tìm thấy " + sc.added + " tin của chủ đầu tư này" : "Đã lưu. Hệ thống sẽ báo khi có tin mới.");
  }, function(e){ F.busy = false; F.msg = "Chưa lưu được (" + e.message + ")."; paintForm(); });
}
function delForm(){
  if (!F.askDel) { F.askDel = true; paintForm(); return; }
  F.busy = true; paintForm();
  api("wDel", { id: F.id }, true).then(function(d){ if (d && d.ok) { S.boot = d; S.sel = ""; close_(); render(); toast("Đã xoá mục theo dõi."); } else { F.busy = false; F.msg = (d && d.error) || "Chưa xoá được."; paintForm(); } },
    function(e){ F.busy = false; F.msg = e.message; paintForm(); });
}
function close_(){ $("ov").classList.remove("show"); F = null; }

/* ── cài đặt bot (Admin) ── */
function openBot(renew){
  $("dlg").innerHTML = '<h4>Cài đặt bot tải hồ sơ</h4><div class="bd"><div class="note" style="padding:0">Đang đọc khoá…</div></div>';
  $("ov").classList.add("show");
  api("wBotKey", renew ? { renew: 1 } : {}, true).then(function(d){
    if (!d || !d.ok) { $("dlg").innerHTML = '<h4>Cài đặt bot</h4><div class="bd"><div class="err" style="margin:0">' + esc((d && d.error) || "Lỗi") + '</div></div><div class="ft"><button class="btn" data-f="close">Đóng</button></div>'; return; }
    $("dlg").innerHTML = '<h4>Cài đặt bot tải hồ sơ</h4><div class="bd"><div><span class="lb">Khoá bot</span><div class="key" id="bk">' + esc(d.key) + '</div><div class="hint">Dán khoá này vào secret <b>WT_BOT_KEY</b> của nơi chạy bot. Không gửi khoá cho người ngoài; lộ khoá ⇒ bấm "Đổi khoá".</div></div>' +
      '<div><span class="lb">Địa chỉ máy chủ</span><div class="key">' + esc(API) + '</div></div></div><div class="ft"><button class="btn dng" data-f="renew">Đổi khoá</button><button class="btn" data-f="copy">Sao chép khoá</button><button class="btn pri" data-f="close">Xong</button></div>';
  }, function(e){ toast(e.message); close_(); });
}

/* ── tải ngay ── */
function quick(){
  var t = $("q-nos"); S.qn = t ? t.value : "";
  var nos = (S.qn.toUpperCase().match(/(IB|PL)\d{8,12}(-\d+)?/g) || []);
  if (!nos.length) { toast("Dán số TBMT (IB…) hoặc KHLCNT (PL…)."); return; }
  S.qbusy = true; render();
  api("wQuick", { nos: nos.join(",") }, true).then(function(d){
    S.qbusy = false;
    if (d && d.ok) { S.boot = d; S.qn = ""; S.sel = "_q"; render(); toast("Đã đưa " + (d.queued || []).length + " gói vào hàng đợi. Máy chủ tải trong vài phút."); }
    else { render(); toast((d && d.error) || "Chưa gửi được."); }
  }, function(e){ S.qbusy = false; render(); toast(e.message); });
}

/* ── cài app (PWA) ── */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; var b = $("inst"); if (b) b.style.display = "inline-block"; });
function install(){
  if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; return; }
  toast(/iphone|ipad|mac/i.test(navigator.userAgent) ? "Safari: bấm nút Chia sẻ ⇒ Thêm vào MH chính." : "Trình duyệt: menu ⋮ ⇒ Cài đặt ứng dụng / Thêm vào màn hình chính.");
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
if (!matchMedia("(display-mode: standalone)").matches) setTimeout(function(){ var b = $("inst"); if (b && /iphone|ipad/i.test(navigator.userAgent)) b.style.display = "inline-block"; }, 500);

/* ── sự kiện ── */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-a],[data-sel],[data-edit],[data-type],[data-dl],[data-f],[data-pick],[data-t],[data-tile],[data-tab],[data-pv],[data-watch],[data-goinv],[data-dsec]");
  if (!t) { return; }
  if (t.hasAttribute("data-edit")) { e.stopPropagation(); openForm(t.getAttribute("data-edit")); return; }
  if (t.hasAttribute("data-tab")) { S.tab = t.getAttribute("data-tab"); try { localStorage.setItem("wt_tab", S.tab); } catch (_) {} if (S.tab === "map") loadInv(function(){ if (S.tab === "map") render(); }, true); render(); scrollTo(0, 0); return; }
  if (t.hasAttribute("data-pv")) { var pv = +t.getAttribute("data-pv"); S.prov = S.prov === pv ? -1 : pv; S.mlim = 40; render(); var pn = $("pv-panel"); if (pn && matchMedia("(max-width:860px)").matches && S.prov >= 0) pn.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.hasAttribute("data-watch")) { openForm(""); F.investor = t.getAttribute("data-watch"); paintForm(); return; }
  if (t.hasAttribute("data-goinv")) { var nm = fold(t.getAttribute("data-goinv")), w0 = ((S.boot || {}).watches || []).filter(function(w){ return fold(w.investor) === nm; })[0]; S.tab = "watch"; S.sel = w0 ? w0.id : ""; S.q = w0 ? "" : t.getAttribute("data-goinv"); render(); return; }
  if (t.hasAttribute("data-dsec")) { S.dsec = t.getAttribute("data-dsec"); render(); return; }
  if (t.hasAttribute("data-tile")) { var k0 = t.getAttribute("data-tile"); if (k0 === "watch") { S.sel = ""; S.st = ""; } else S.st = S.st === k0 ? "" : k0; S.lim = 60; render(); return; }
  if (t.hasAttribute("data-sel")) { S.sel = t.getAttribute("data-sel"); S.lim = 60; S.hl = ""; render(); return; }
  if (t.hasAttribute("data-type")) { S.type = t.getAttribute("data-type"); S.lim = 60; render(); return; }
  if (t.hasAttribute("data-pick")) { pick(t.getAttribute("data-pick")); return; }
  if (t.hasAttribute("data-t")) { var k = t.getAttribute("data-t"), i = F.types.indexOf(k); readForm(); if (t.checked && i < 0) F.types.push(k); if (!t.checked && i >= 0) F.types.splice(i, 1); paintForm(); return; }
  if (t.hasAttribute("data-dl")) {
    var key = t.getAttribute("data-dl"); t.disabled = true;
    api("wHit", { key: key, op: "dl" }, true).then(function(d){ if (d && d.ok) { (S.boot.hits || []).forEach(function(x){ if (x.key === key) x.status = "Chờ tải"; }); render(); toast("Đã đưa vào hàng đợi tải."); } else { t.disabled = false; toast((d && d.error) || "Chưa được."); } },
      function(err){ t.disabled = false; toast(err.message); });
    return;
  }
  var a = t.getAttribute("data-a"), f = t.getAttribute("data-f");
  if (a === "add") openForm("");
  else if (a === "quick") quick();
  else if (a === "install") install();
  else if (a === "more") { S.lim += 100; render(); }
  else if (a === "mmore") { S.mlim = (S.mlim || 40) + 60; render(); }
  else if (a === "reload") load();
  else if (a === "bot") openBot(false);
  else if (a === "acct") openAcct();
  else if (a === "out") { try { localStorage.removeItem("mmh_tk"); localStorage.removeItem("wt_boot1"); } catch (_) {} S.boot = null; close_(); render(); }
  else if (a === "later") { try { localStorage.setItem("tm_pw_later:" + lg.email.split("@")[0], String(Date.now() + 7 * 864e5)); } catch (_) {} lg.step = "pw"; load(); }
  else if (a === "eye") { var pi = t.previousElementSibling; if (pi) { var sh = pi.type === "password"; pi.type = sh ? "text" : "password"; t.textContent = sh ? "Ẩn" : "Hiện"; } }
  else if (a === "code") sendCode();
  else if (a === "back") { lg.step = "pw"; lg.err = ""; render(); }
  else if (f === "close") close_();
  else if (f === "save") saveForm();
  else if (f === "del") delForm();
  else if (f === "repick") { readForm(); F.investor = ""; paintForm(); paintSugg(); }
  else if (f === "renew") openBot(true);
  else if (f === "copy") { var k2 = $("bk"); if (k2 && navigator.clipboard) navigator.clipboard.writeText(k2.textContent).then(function(){ toast("Đã sao chép khoá."); }); }
});
document.addEventListener("change", function(e){ if (e.target.id === "f-st") { S.st = e.target.value; render(); } });
document.addEventListener("input", function(e){ if (e.target.id === "d-q" || e.target.id === "m-q") { S[e.target.id === "d-q" ? "dq" : "mq"] = e.target.value; clearTimeout(S._dt); var id0 = e.target.id; S._dt = setTimeout(function(){ var p = e.target.selectionStart; render(); var q = $(id0); if (q) { q.focus(); q.setSelectionRange(p, p); } }, 200); return; }
  if (e.target.id === "f-q") { S.q = e.target.value; clearTimeout(S._qt); S._qt = setTimeout(function(){ var p = e.target.selectionStart; render(); var q = $("f-q"); if (q) { q.focus(); q.setSelectionRange(p, p); } }, 250); } });
$("ov").addEventListener("click", function(e){ if (e.target.id === "ov") close_(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("ov").classList.contains("show")) close_(); });
window.addEventListener("hashchange", jump);
setInterval(function(){
  if (!auth() || document.visibilityState !== "visible" || $("ov").classList.contains("show")) return;
  var busy = ((S.boot || {}).hits || []).some(function(x){ return x.status === "Chờ tải" || x.status === "Đang tải"; });
  var now = Date.now(); if (busy ? now - (S._lt || 0) > 45e3 : now - (S._lt || 0) > 5 * 60e3) { S._lt = now; load(); }
}, 15e3);

if (auth()) load(); else render();
</script>
</body>
