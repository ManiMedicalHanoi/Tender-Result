# Tạm thời: dò AI / dịch máy miễn phí cho MMH Daily.
name: Dò AI miễn phí
on:
  push:
    branches: ['claude/health-policy-news-aggregator-gvxs88']
    paths: ['daily/tools/probe2.mjs', '.github/workflows/daily-probe2.yml']
permissions: { contents: read, models: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node daily/tools/probe2.mjs
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
