# Tạm thời: dò nguồn tin cho Bản tin Y tế (xoá sau khi chốt nguồn).
name: Dò nguồn tin
on:
  push:
    branches: ['claude/health-policy-news-aggregator-gvxs88']
    paths: ['tools/news/probe.mjs', '.github/workflows/news-probe.yml']
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/news/probe.mjs
