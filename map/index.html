<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ trúng thầu 3D · MMH</title>
<meta name="description" content="Bản đồ 3D Việt Nam: bệnh viện, tỉnh / thành trúng thầu của NPP Hùng Vĩ và iCare từ FY67 — theo nhóm sản phẩm, lịch sử và hiệu lực gói thầu.">
<style>
@font-face{font-family:Aptos;src:local(Aptos),local(Aptos-Regular);font-weight:100 500}
@font-face{font-family:Aptos;src:local('Aptos Semibold'),local(Aptos-SemiBold);font-weight:600}
@font-face{font-family:Aptos;src:local('Aptos Bold'),local(Aptos-Bold);font-weight:700 900}
:root{
  --ff:Aptos,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --bg0:#050F1C; --bg1:#0A1D33; --bg2:#0F2742;
  --glass:rgba(10,26,46,.80); --glass2:rgba(16,36,62,.78); --edge:rgba(140,180,230,.16); --edge2:rgba(140,180,230,.28);
  --t1:#EAF2FF; --t2:#A9BCD6; --t3:#6F86A6;
  --acc:#5AA9FF; --gold:#FFC857; --ok:#3DDC97; --warn:#FFB547; --bad:#FF6B6B; --mute:#8193AE;
  --hv:#3B82F6; --ic:#14B8A6; --both:#8B5CF6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ff);color:var(--t1);font-size:13.5px;background:radial-gradient(1200px 900px at 62% 42%,#123459 0%,#0A1D33 45%,#050F1C 100%);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,170,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 60% 45%,#000 30%,transparent 80%)}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc)}
#stage{position:fixed;inset:0}
#stage canvas{outline:none}

/* ── thanh trên ── */
.top{position:fixed;left:12px;right:12px;top:12px;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16.5px;letter-spacing:.2px;white-space:nowrap}
.brand b i{font-style:normal;color:var(--acc)}
.brand span{font-size:12px;color:var(--t2);white-space:nowrap}
.filters{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--t2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--edge)}
.seg button.on{background:rgba(90,169,255,.18);color:#fff;font-weight:600}
.btn{border:1px solid var(--edge2);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--t2);white-space:nowrap;text-decoration:none}
.btn:hover,.seg button:hover{color:#fff}
.btn.on{background:rgba(90,169,255,.18);color:#fff;border-color:rgba(90,169,255,.5)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── bảng nổi ── */
.panel{position:fixed;z-index:9;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
#left{left:12px;top:84px;bottom:12px;width:318px}
#right{right:12px;top:84px;bottom:12px;width:410px}
.ph{padding:12px 14px 8px;border-bottom:1px solid var(--edge)}
.ph h2{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px}
.ph .sub{color:var(--t2);font-size:12px;margin-top:3px;line-height:1.4}
.pb{overflow:auto;padding:10px 14px 16px;flex:1;scrollbar-width:thin;scrollbar-color:rgba(140,180,230,.25) transparent}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);margin:16px 0 8px;font-weight:700}
h3:first-child{margin-top:4px}
.back{border:1px solid var(--edge2);background:none;border-radius:8px;cursor:pointer;color:var(--t2);padding:2px 8px;font-size:12px}
.back:hover{color:#fff}

.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge2);background:rgba(255,255,255,.03);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;color:var(--t2);font-size:12.5px}
.gc i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gc em{font-style:normal;color:var(--t3);font-size:11.5px}
.gc.on{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
.gc.off{opacity:.45}
.gc.head{font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1px solid transparent;background:none;border-radius:8px;padding:4px 8px;cursor:pointer;color:var(--t2);font-size:12px}
.tab.on{border-color:var(--edge2);background:rgba(90,169,255,.14);color:#fff;font-weight:600}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer}
.rank li:hover,.rank li.hl{background:rgba(255,255,255,.06)}
.rank .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:rgba(255,255,255,.07);color:var(--t2)}
.rank li:nth-child(-n+3) .no{background:linear-gradient(135deg,#FFE29A,#FFB547);color:#3A2600}
.rank .nm{font-weight:600;line-height:1.25;font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rank .q{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;text-align:right}
.rank .q small{display:block;font-weight:500;color:var(--t3);font-size:11px}
.rank .bar{grid-column:2/4;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.rank .bar b{display:block;height:100%;border-radius:2px}
.rank .pv{grid-column:2/4;font-size:11.5px;color:var(--t3)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:12px;padding:9px 10px;position:relative;overflow:hidden}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi span{font-size:11.5px;color:var(--t2)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.gold b{color:var(--gold)}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.06);margin:4px 0 8px}
.mix i{display:block;height:100%}
.mixl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.mixl span{display:flex;align-items:center;gap:7px;color:var(--t2)}
.mixl span i{width:9px;height:9px;border-radius:3px;flex:none}
.mixl b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.bars .r{display:grid;grid-template-columns:92px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bars .r.click{cursor:pointer;border-radius:8px}
.bars .r.click:hover{background:rgba(255,255,255,.05)}
.bars .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;display:flex}
.bars .bar i{display:block;height:100%}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mon{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:4px;margin-bottom:26px}
.mon .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.mon .c i{display:block;border-radius:2px 2px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.mon .c i+i{border-radius:0}
.mon .c .m{font-size:10px;color:var(--t3);text-align:center;margin-top:3px;height:12px}
.mon .c.now .m{color:var(--warn);font-weight:700}
.mon .c .f{position:absolute;bottom:-16px;left:0;font-size:10px;color:var(--t2);font-weight:700;white-space:nowrap}
.mon .c.fy{border-left:1px dashed rgba(140,180,230,.25);padding-left:2px}

.card{background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin:8px 0}
.card.click{cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.card.click:hover{background:rgba(255,255,255,.06);border-color:var(--edge2);transform:translateY(-1px)}
.card .t{font-weight:700;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--t2);margin-top:4px}
.meta b{color:var(--t1);font-weight:600}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;border:1px solid}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.08)}
.st.warn{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.08)}
.st.bad{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.07)}
.st.mute{color:var(--mute);border-color:rgba(129,147,174,.35)}
.st.win{color:var(--ok);border-color:rgba(61,220,151,.35)}
.st.fail{color:var(--bad);border-color:rgba(255,107,107,.35)}
.st.pend{color:var(--warn);border-color:rgba(255,181,71,.4)}
.npp{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pc{font-size:11.5px;border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.06);color:var(--t1);display:inline-flex;gap:4px;align-items:center}
.pc i{width:7px;height:7px;border-radius:2px}
.minimix{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:7px;background:rgba(255,255,255,.06)}
.minimix i{display:block;height:100%}
.tl{height:7px;border-radius:4px;background:rgba(255,255,255,.08);margin:9px 0 4px;position:relative;overflow:hidden}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tl i:after{content:"";position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 8px #fff}
.tld{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}
table.pr{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
table.pr th{text-align:left;font-weight:600;color:var(--t3);padding:4px 5px;border-bottom:1px solid var(--edge)}
table.pr td{padding:4px 5px;border-top:1px solid rgba(140,180,230,.07);font-variant-numeric:tabular-nums}
table.pr .r{text-align:right}
.hist{position:relative;margin-left:8px;padding-left:16px;border-left:2px solid rgba(140,180,230,.18)}
.hist .ev{position:relative;padding:2px 0 12px}
.hist .ev:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg1);border:2px solid var(--mute)}
.hist .ev.win:before{border-color:var(--ok);background:var(--ok);box-shadow:0 0 10px rgba(61,220,151,.7)}
.hist .ev.fail:before{border-color:var(--bad)}
.hist .ev.pend:before{border-color:var(--warn)}
.hist .fyh{font-size:11px;font-weight:800;color:var(--t3);letter-spacing:.8px;margin:2px 0 8px -24px;background:var(--bg1);display:inline-block;padding:1px 6px;border-radius:6px;border:1px solid var(--edge)}
.hist .d{font-size:11.5px;color:var(--t2)}
.hist .tt{font-weight:600;line-height:1.3;margin:1px 0}
.old{opacity:.6}
.ribbon{border-radius:12px;padding:10px 12px;margin:6px 0 4px;border:1px solid;display:flex;gap:10px;align-items:center}
.ribbon.ok{border-color:rgba(61,220,151,.35);background:linear-gradient(90deg,rgba(61,220,151,.14),rgba(61,220,151,.02))}
.ribbon.warn{border-color:rgba(255,181,71,.4);background:linear-gradient(90deg,rgba(255,181,71,.15),rgba(255,181,71,.02))}
.ribbon.bad{border-color:rgba(255,107,107,.35);background:linear-gradient(90deg,rgba(255,107,107,.12),rgba(255,107,107,.02))}
.ribbon.mute{border-color:var(--edge2);background:rgba(255,255,255,.03)}
.ribbon b{display:block;font-size:14px}
.ribbon span{font-size:12px;color:var(--t2)}
.empty{color:var(--t3);font-size:12.5px;padding:8px 0}
.note{font-size:12px;color:var(--t2);background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.25);border-radius:10px;padding:8px 10px;margin:8px 0}
.note.err{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3);color:#FFB3B3}
.foot{font-size:11px;color:var(--t3);margin-top:16px;line-height:1.55}
.search{width:100%;border:1px solid var(--edge2);background:rgba(255,255,255,.04);color:var(--t1);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:12.5px;margin:2px 0 6px}
.search::placeholder{color:var(--t3)}
.search:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(90,169,255,.18)}
.ochips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}

/* ── điều khiển bản đồ ── */
.ctl{position:fixed;z-index:9;left:342px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.ctl .btn{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.legend{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:14px;display:none}
.navbar{position:fixed;z-index:11;left:342px;top:84px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 790px)}
.backbtn{display:none;align-items:center;gap:6px;padding:7px 14px 7px 10px;border-radius:999px;border:1px solid rgba(90,169,255,.6);background:rgba(28,74,132,.92);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap;animation:fd .3s ease}
.backbtn.show{display:inline-flex}
.backbtn b{font-size:20px;line-height:.7;margin-top:-2px}
.backbtn:hover{background:rgba(40,96,170,.95)}
.crumb{display:flex;gap:6px;align-items:center;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--t2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:#fff}
.crumb a{cursor:pointer;text-decoration:none}
.npleg{position:fixed;z-index:9;right:434px;bottom:14px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:8px 11px;font-size:11.5px;color:var(--t2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);line-height:1.7}
.npleg i{display:inline-block;width:18px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .12s;left:0;top:0}
#tip.show{opacity:1}
.tip{font-family:var(--ff);background:rgba(6,16,30,.94);border:1px solid var(--edge2);border-radius:10px;padding:8px 10px;color:var(--t1);font-size:12.5px;line-height:1.45;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tip b{font-size:13.5px}
.tip .m{color:var(--t2)}
.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(800px 600px at 50% 45%,rgba(18,52,89,.85),rgba(5,15,28,.96));transition:opacity .6s}
.loader.hide{opacity:0;pointer-events:none}
.loader .ring{width:62px;height:62px;border-radius:50%;border:3px solid rgba(90,169,255,.18);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 14px}
.loader p{margin:0;color:var(--t2);text-align:center}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.loader .ring{animation:none}}

.hint{position:fixed;z-index:13;left:50%;top:132px;transform:translateX(-50%);max-width:560px;background:rgba(28,74,132,.94);border:1px solid rgba(90,169,255,.55);border-radius:12px;padding:9px 34px 9px 14px;font-size:12.5px;line-height:1.5;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .4s}
.hint.hide{opacity:0;pointer-events:none}
.hint button{position:absolute;right:6px;top:6px;border:0;background:none;color:#fff;font-size:16px;cursor:pointer;padding:2px 6px}
#fslot{margin-left:auto}
#sheet{display:contents}
.sh-grab,.sh-tabs,#filt,.mfilt{display:none}
#filt .filters{flex-wrap:wrap;justify-content:flex-start;margin:0 0 14px}
#filt .legend2{font-size:12px;color:var(--t2);line-height:1.8;margin-top:14px}
#filt .legend2 i{display:inline-block;width:18px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:1180px){ #left{width:280px} .ctl,.navbar{left:304px} .navbar{max-width:calc(100% - 690px)} #right{width:360px} .npleg{right:384px} }
@media (max-width:900px){
  body{font-size:13px}
  .top{left:8px;right:8px;top:8px;padding:8px 10px;gap:8px;border-radius:12px}
  .brand b{font-size:14px}
  .brand{flex:1;min-width:0}
  .brand b,.brand span{overflow:hidden;text-overflow:ellipsis}
  .brand span{font-size:11px}
  #fslot{display:none}
  .mfilt{display:inline-flex!important;margin-left:auto;flex:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sh,44vh);z-index:12;display:flex;flex-direction:column;background:rgba(8,22,40,.95);border-top:1px solid var(--edge2);border-radius:18px 18px 0 0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:height .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 32px rgba(0,0,0,.4)}
  #sheet.drag{transition:none}
  .sh-grab{display:block;padding:9px 0 5px;cursor:grab;touch-action:none}
  .sh-grab i{display:block;width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);margin:0 auto}
  .sh-tabs{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--edge)}
  .sh-tabs button{flex:1;border:1px solid transparent;background:none;border-radius:10px;padding:8px 4px;color:var(--t2);font-weight:700;font-size:13px;cursor:pointer}
  .sh-tabs button.on{background:rgba(90,169,255,.16);color:#fff;border-color:rgba(90,169,255,.35)}
  #sheet .panel{position:static;display:none;flex:1;min-height:0;width:auto!important;border:0;border-radius:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  #sheet .panel.act{display:flex}
  #left .ph,#filt .ph{display:none}
  .navbar{left:8px;top:66px;max-width:calc(100% - 84px)}
  .crumb{display:none}
  .ctl{left:auto;right:8px;top:66px;bottom:auto;flex-direction:column;align-items:flex-end}
  .ctl .btn{padding:6px 10px;font-size:12px}
  .npleg{display:none}
  .hint{top:auto;bottom:calc(var(--sh,44vh) + 12px);width:calc(100% - 24px)}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi b{font-size:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <b>Bản đồ trúng thầu <i>3D</i> · NPP nhãn khoa</b>
    <span>Hùng Vĩ (miền Bắc) · iCare (miền Nam) — từ FY67 (09/2025)</span>
  </div>
  <button class="btn mfilt" id="m-filt" aria-label="Mở bộ lọc">Bộ lọc</button>
  <div id="fslot"><div class="filters" role="toolbar" aria-label="Bộ lọc">
    <div class="seg" id="f-fy" aria-label="Năm tài chính"></div>
    <div class="seg" id="f-q" aria-label="Quý"></div>
    <div class="seg" id="f-npp" aria-label="Nhà phân phối"></div>

function jsonp(url,ms){ return new Promise(function(res,rej){ var cb="__wm3"+Math.random().toString(36).slice(2), s=document.createElement("script"), done=false;

  return fetch(url,{redirect:"follow",signal:ctl?ctl.signal:undefined}).then(function(r){ clearTimeout(to); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).catch(function(){ clearTimeout(to); return jsonp(url,30000); }); }

  throw new Error((d&&d.error)||"dữ liệu lạ"); }); }
