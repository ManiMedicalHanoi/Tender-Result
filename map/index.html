<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ trúng thầu NPP nhãn khoa · MMH</title>
<meta name="description" content="Bản đồ Việt Nam: tỉnh / thành có gói thầu trúng của NPP Hùng Vĩ và iCare, từ FY67.">
<style>
@font-face{font-family:Aptos;src:local(Aptos),local(Aptos-Regular);font-weight:100 500}
@font-face{font-family:Aptos;src:local('Aptos Semibold'),local(Aptos-SemiBold);font-weight:600}
@font-face{font-family:Aptos;src:local('Aptos Bold'),local(Aptos-Bold);font-weight:700 900}
:root{
  --ff:Aptos,'Segoe UI',system-ui,-apple-system,sans-serif;
  --navy:#003047; --blue:#3A5CAA; --sky:#5188CC; --lb:#CFE2F3; --pale:#F0F7FF;
  --bg:#F4F7FB; --sf:#fff; --sf2:#F7F9FC; --line:#E6EAEF; --line2:#D5DDE8;
  --t1:#0F2537; --t2:#55667D; --t3:#8C9AAD;
  --hv:#3A5CAA; --ic:#0E8C7E;           /* Hùng Vĩ · iCare */
  --ok:#2E7D32; --warn:#C77700; --bad:#B42318; --mute:#98A2B3;
  --sea1:#EAF2FB; --sea2:#DCE8F5; --land:#E9EEF4; --landline:#FFFFFF;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}

/* ── thanh trên ── */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:18px;color:var(--navy);letter-spacing:.1px}
.brand span{font-size:12.5px;color:var(--t2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--t2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pale);color:var(--blue);font-weight:600}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.btn{border:1px solid var(--line2);background:var(--sf);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--t2)}
.btn:hover{border-color:var(--sky);color:var(--blue)}

/* ── bố cục ── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,34%);gap:16px;padding:16px 20px;height:calc(100% - 66px)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.mapcard{position:relative;overflow:hidden;min-height:520px;background:radial-gradient(120% 90% at 70% 40%,var(--sea1),var(--sea2))}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.prov{stroke:var(--landline);stroke-width:.9;vector-effect:non-scaling-stroke;transition:fill .35s,opacity .35s;cursor:pointer}
.prov:hover{filter:brightness(.93)}
.prov.sel{stroke:var(--navy);stroke-width:2}
.prov.dim{opacity:.45}
.old{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:.6;stroke-dasharray:2 2;vector-effect:non-scaling-stroke;pointer-events:none}
.old.off{display:none}
.lbl{font-weight:600;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lbl .n{font-weight:800}
.bdg circle{fill:#fff;vector-effect:non-scaling-stroke;stroke-width:2}
.bdg text{font-weight:800;fill:var(--navy);text-anchor:middle;pointer-events:none}
.bdg{pointer-events:none}
.lbl.mute{fill:#8C9AAD;font-weight:500}
.isl circle{fill:#9FB2C8}
.isl text{fill:#5B6E8C;font-style:italic;text-anchor:middle;paint-order:stroke;stroke:var(--sea1);stroke-width:3px}
.sea{fill:#7F96B2;font-style:italic;text-anchor:middle;pointer-events:none;opacity:.55}
.bub{cursor:pointer}
.bub circle.c{stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:1.5}
.bub text{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none}
.bub .t2{fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;font-weight:600}
.pulse{fill:none;stroke:var(--warn);vector-effect:non-scaling-stroke;stroke-width:2;animation:pl 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes pl{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;display:none}.prov{transition:none}}

.mapui{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--sf);cursor:pointer;font-size:18px;line-height:1;color:var(--navy)}
.crumb{position:absolute;left:58px;top:14px;z-index:2;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--t2)}
.crumb b{color:var(--navy)}
.crumb a{cursor:pointer;text-decoration:none}
.legend{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--t2);max-width:260px}
.legend .row{display:flex;align-items:center;gap:8px;margin:3px 0}
.ramp{display:flex;height:9px;border-radius:5px;overflow:hidden;width:120px}
.ramp i{flex:1}
.legend label{display:flex;gap:6px;align-items:center;cursor:pointer;margin-top:6px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--navy);color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:260px;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,48,71,.18)}
.tip b{font-size:13.5px}
.tip .m{color:#BFD3EA}
.load{position:absolute;inset:auto 0 0 0;top:50%;text-align:center;color:var(--t2);z-index:3}

/* ── bảng bên phải ── */
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sidehd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sidehd h2{margin:0;font-size:17px;color:var(--navy)}
.sidehd .sub{color:var(--t2);font-size:12.5px;margin-top:2px}
.sidebd{overflow:auto;padding:12px 16px 18px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--t2)}
.kpi.warn b{color:var(--warn)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);margin:16px 0 8px;font-weight:600}
.bars .r{display:grid;grid-template-columns:96px 1fr 84px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .r.click{cursor:pointer;border-radius:6px}
.bars .r.click:hover{background:var(--pale)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--t1)}
.npp{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{border:1px solid var(--line2);background:var(--sf);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--t2)}
.chip.on{background:var(--pale);border-color:var(--blue);color:var(--blue);font-weight:600}
.chip em{font-style:normal;color:var(--t3);margin-left:4px}
.search{width:100%;border:1px solid #C3CDD8;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;margin:4px 0 8px}
.search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,92,170,.15)}

.hosp{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.hosp>.hh{padding:9px 12px;display:flex;gap:8px;align-items:flex-start;background:var(--sf2);cursor:pointer}
.hosp>.hh .nm{font-weight:600;color:var(--navy);flex:1;line-height:1.35}
.hosp>.hh .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pkg{padding:10px 12px;border-top:1px solid var(--line)}
.pkg .t{font-weight:600;line-height:1.35;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--t2)}
.meta b{color:var(--t1);font-weight:600}
.st{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;border:1px solid}
.st.ok{color:var(--ok);border-color:#B7DDB9;background:#F1F8F1}
.st.warn{color:var(--warn);border-color:#F3D19C;background:#FFF8EC}
.st.bad{color:var(--bad);border-color:#F3C1BC;background:#FEF3F2}
.st.mute{color:#667085;border-color:var(--line2);background:var(--sf2)}
.st.win{color:var(--ok);border-color:#B7DDB9}
.st.fail{color:var(--bad);border-color:#F3C1BC}
.st.pend{color:var(--warn);border-color:#F3D19C}
.tl{height:6px;border-radius:3px;background:var(--line);margin:8px 0 4px;position:relative;overflow:hidden}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.tld{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3)}
table.pr{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
table.pr th{text-align:left;font-weight:600;color:var(--t2);background:var(--pale);padding:5px 6px}
table.pr td{padding:5px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.pr td.r,table.pr th.r{text-align:right}
.exp .it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.exp .it:hover{background:var(--pale)}
.exp .it .a{font-weight:600;color:var(--navy);line-height:1.3}
.exp .it .b{font-size:12px;color:var(--t2)}
.empty{color:var(--t3);font-size:13px;padding:10px 0}
.note{font-size:12px;color:var(--t2);background:var(--pale);border:1px solid var(--lb);border-radius:8px;padding:8px 10px;margin:8px 0}
.note.err{background:#FEF3F2;border-color:#F3C1BC;color:var(--bad)}
.foot{font-size:11.5px;color:var(--t3);margin-top:16px;line-height:1.5}
.mon{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.mon .c{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;position:relative;min-width:0}
.mon .c i{display:block;border-radius:2px 2px 0 0}
.mon .c i+i{border-radius:0}
.mon .c .m{font-size:10.5px;color:var(--t3);text-align:center;margin-top:3px;height:14px}
.mon .c.now .m{color:var(--warn);font-weight:700}
.mon .c .f{position:absolute;bottom:-17px;left:0;font-size:10.5px;color:var(--t2);font-weight:600;white-space:nowrap}
.mon .c.fy{border-left:1px dashed var(--line2);padding-left:2px}
.monwrap{padding-bottom:18px}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr;height:auto}
  .mapcard{height:72vh;min-height:420px}
  .side{max-height:none}
  .top{padding:10px 16px}
  .filters{margin-left:0}
  .wrap{padding:12px 16px}
}
@media (max-width:600px){
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .seg,.btn{flex:none}
  .legend{font-size:11px;padding:7px 9px;right:8px;bottom:8px}
  .legend .lx{display:none}
  .ramp{width:70px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <b>Bản đồ trúng thầu · NPP nhãn khoa</b>
    <span>Hùng Vĩ (miền Bắc) · iCare (miền Nam) — từ FY67 (09/2025)</span>
  </div>
  <div class="filters" role="toolbar" aria-label="Bộ lọc">
    <div class="seg" id="f-fy" aria-label="Năm tài chính"></div>
    <div class="seg" id="f-q" aria-label="Quý"></div>
    <div class="seg" id="f-npp" aria-label="Nhà phân phối"></div>
    <div class="seg" id="f-cat" aria-label="Nhóm sản phẩm"></div>
    <div class="seg" id="f-res" aria-label="Kết quả"></div>
    <button class="btn" id="reload" title="Đọc lại dữ liệu từ 2 file NPP">Tải lại</button>
  </div>
</header>

<main class="wrap">
  <section class="card mapcard" aria-label="Bản đồ Việt Nam">
    <svg id="map" role="img" aria-label="Bản đồ tỉnh thành Việt Nam có gói thầu trúng"></svg>
    <div class="mapui">
      <button class="zbtn" id="zin" title="Phóng to" aria-label="Phóng to">+</button>
      <button class="zbtn" id="zout" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
      <button class="zbtn" id="zhome" title="Toàn quốc" aria-label="Toàn quốc">⌂</button>
    </div>
    <div class="crumb" id="crumb"><b>Toàn quốc</b></div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
    <div class="load" id="load">Đang đọc dữ liệu 2 NPP…</div>
  </section>
  <aside class="card side" aria-live="polite">
    <div class="sidehd"><h2 id="sh-t">Toàn quốc</h2><div class="sub" id="sh-s"></div></div>
    <div class="sidebd" id="sb"></div>
  </aside>
</main>

<script src="vn-geo.js"></script>
<script>
(function(){
"use strict";
/* ═════════ CẤU HÌNH ═════════ */
var NPP = {
  HUNGVI:{ name:"Hùng Vĩ", area:"Miền Bắc", color:"#3A5CAA",
    url:"https://script.google.com/macros/s/AKfycbyL5FRVXl0Zr35ndE1PGJMGXzHOYzHjdsyQK7vHwIYhqe5owjSg3o1QtH-i8qGNBKJ-/exec" },
  ICARE: { name:"iCare",   area:"Miền Nam", color:"#0E8C7E",
    url:"https://script.google.com/macros/s/AKfycbx8xuGaBOVgLxb8JtaH25t1pcisacigDecTMLKOVaBucuDWZ7hw2W_W4IngA1nSODg4/exec" }
};
var FY_FROM = 67;                 // FY67 = 09/2025 – 08/2026
var SOON_MONTHS = 6;              // "sắp hết hạn" = còn ≤ 6 tháng
var LS_KEY = "mmh_winmap_v1";

/* 34 tỉnh / thành (NQ 202/2025/QH15, hiệu lực 01/07/2025) ⇐ tỉnh cũ */
var NEW = [
 ["Hà Nội","B",["Hà Nội"]],["Bắc Ninh","B",["Bắc Ninh","Bắc Giang"]],["Quảng Ninh","B",["Quảng Ninh"]],
 ["Hải Phòng","B",["Hải Phòng","Hải Dương"]],["Hưng Yên","B",["Hưng Yên","Thái Bình"]],["Ninh Bình","B",["Ninh Bình","Nam Định","Hà Nam"]],
 ["Cao Bằng","B",["Cao Bằng"]],["Tuyên Quang","B",["Tuyên Quang","Hà Giang"]],["Lào Cai","B",["Lào Cai","Yên Bái"]],
 ["Thái Nguyên","B",["Thái Nguyên","Bắc Kạn"]],["Lạng Sơn","B",["Lạng Sơn"]],["Phú Thọ","B",["Phú Thọ","Vĩnh Phúc","Hòa Bình"]],
 ["Điện Biên","B",["Điện Biên"]],["Lai Châu","B",["Lai Châu"]],["Sơn La","B",["Sơn La"]],
 ["Thanh Hóa","T",["Thanh Hóa"]],["Nghệ An","T",["Nghệ An"]],["Hà Tĩnh","T",["Hà Tĩnh"]],["Quảng Trị","T",["Quảng Trị","Quảng Bình"]],
 ["Huế","T",["Thừa Thiên Huế"]],["Đà Nẵng","T",["Đà Nẵng","Quảng Nam"]],["Quảng Ngãi","T",["Quảng Ngãi","Kon Tum"]],
 ["Khánh Hòa","T",["Khánh Hòa","Ninh Thuận"]],["Gia Lai","T",["Gia Lai","Bình Định"]],["Đắk Lắk","T",["Đắk Lắk","Phú Yên"]],
 ["Lâm Đồng","T",["Lâm Đồng","Đắk Nông","Bình Thuận"]],
 ["Tây Ninh","N",["Tây Ninh","Long An"]],["Đồng Nai","N",["Đồng Nai","Bình Phước"]],["Hồ Chí Minh","N",["Hồ Chí Minh","Bình Dương","Bà Rịa - Vũng Tàu"]],
 ["Vĩnh Long","N",["Vĩnh Long","Bến Tre","Trà Vinh"]],["Đồng Tháp","N",["Đồng Tháp","Tiền Giang"]],["An Giang","N",["An Giang","Kiên Giang"]],
 ["Cần Thơ","N",["Cần Thơ","Hậu Giang","Sóc Trăng"]],["Cà Mau","N",["Cà Mau","Bạc Liêu"]]
];
var REGION = { B:"Miền Bắc", T:"Miền Trung", N:"Miền Nam" };
var ALIAS = { "tphcm":"hochiminh","hcm":"hochiminh","saigon":"hochiminh","thuathien":"thuathienhue","hue":"thuathienhue",
  "brvt":"bariavungtau","vungtau":"bariavungtau","daklak":"daklak","daknong":"daknong","hoabinh":"hoabinh" };

/* ═════════ TIỆN ÍCH ═════════ */
function nk(s){
  s = String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
  s = s.replace(/^(thanhpho|tp|tinh)/,"");
  s = s.replace(/^dac/,"dak").replace(/^dak(lak|nong)$/,"dak$1");
  return ALIAS[s] || s;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function vnd(v){ v=+v||0; if(v>=1e9) return (v/1e9).toFixed(v>=1e10?1:2).replace(".",",").replace(/,?0+$/,"")+" tỷ"; if(v>=1e6) return Math.round(v/1e6).toLocaleString("vi-VN")+" tr"; return Math.round(v).toLocaleString("vi-VN")+" đ"; }
function nfmt(v){ return (+v||0).toLocaleString("vi-VN"); }
function d2(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function monKey(iso){ return iso ? (+iso.slice(0,4))*100 + (+iso.slice(5,7)) : 0; }
function fyOf(k){ if(!k) return 0; var y=Math.floor(k/100), m=k%100; return (m>=9 ? y+1 : y) - 1959; }   // 2025-09 → 67
function qOf(k){ var m=k%100; return Math.floor(((m+3)%12)/3)+1; }                                       // T9–11 = Q1
function addMonths(iso,n){ var d=new Date(iso+"T00:00:00"); var day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthsBetween(a,b){ var A=new Date(a+"T00:00:00"),B=new Date(b+"T00:00:00"); return (B-A)/(30.44*864e5); }
var NOW = today(), NOWK = monKey(NOW), FY_NOW = fyOf(NOWK);

/* tỉnh cũ / mới ⇒ chỉ số */
var OLD2NEW = {}, NEWIDX = {};
NEW.forEach(function(p,i){ NEWIDX[nk(p[0])]=i; p[2].forEach(function(o){ OLD2NEW[nk(o)]=i; }); });
NEWIDX[nk("Thừa Thiên Huế")] = NEWIDX[nk("Huế")];
function provOf(city, addr){
  var c=nk(city), i;
  if(c in OLD2NEW) return {n:OLD2NEW[c], o:c};
  if(c in NEWIDX){ i=NEWIDX[c]; return {n:i, o:oldIn(i, addr) || nk(NEW[i][2][0])}; }
  // không nhận ra ⇒ dò trong địa chỉ (tên tỉnh thường ở cuối)
  var a=nk(addr), best=null, pos=-1;

  if(anim) cancelAnimationFrame(anim);
  var s=Object.assign({},vb), t0=performance.now(); ms = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : (ms||650);
  (function step(now){
    var u=Math.min(1,(now-t0)/ms), e=u<.5? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
    setVB({x:s.x+(t.x-s.x)*e, y:s.y+(t.y-s.y)*e, w:s.w+(t.w-s.w)*e, h:s.h+(t.h-s.h)*e});
    if(u<1) anim=requestAnimationFrame(step); else { anim=null; paintMap(); }
  })(t0);
}
function fitBox(bb, pad){
  var r=svg.getBoundingClientRect(), ar=r.width/Math.max(1,r.height);
  var w=bb[2]-bb[0], h=bb[3]-bb[1]; pad=pad||.18;
  w*= (1+pad*2); h*=(1+pad*2);
  if(w/h < ar) w=h*ar; else h=w/ar;
  var minW = VB0.w/10; if(w<minW){ h*=minW/w; w=minW; }
  return { x:(bb[0]+bb[2])/2-w/2, y:(bb[1]+bb[3])/2-h/2, w:w, h:h };
}
function zoomBy(f, cx, cy){
  var nw=Math.max(VB0.w/14, Math.min(VB0.w*1.2, vb.w*f)), nh=vb.h*nw/vb.w;
  if(cx==null){ cx=vb.x+vb.w/2; cy=vb.y+vb.h/2; }
  var nx=cx-(cx-vb.x)*nw/vb.w, ny=cy-(cy-vb.y)*nh/vb.h;
  setVB({x:nx,y:ny,w:nw,h:nh}); schedPaint();
}
var pt=null; function schedPaint(){ if(pt) return; pt=requestAnimationFrame(function(){ pt=null; paintMap(); }); }
function svgPt(e){ var r=svg.getBoundingClientRect(); var sx=vb.w/r.width, sy=vb.h/r.height, s=Math.max(sx,sy);
  var ox=(r.width*s-vb.w)/2, oy=(r.height*s-vb.h)/2; return { x:vb.x+(e.clientX-r.left)*s-ox, y:vb.y+(e.clientY-r.top)*s-oy, s:s }; }

function wireMap(){
  var tip=document.getElementById("tip"), card=svg.parentNode, drag=null, moved=false;
  svg.addEventListener("wheel",function(e){ e.preventDefault(); var p=svgPt(e); zoomBy(e.deltaY>0?1.18:1/1.18, p.x, p.y); },{passive:false});
  svg.addEventListener("pointerdown",function(e){ drag={x:e.clientX,y:e.clientY,vb:Object.assign({},vb),s:svgPt(e).s}; moved=false; });
  window.addEventListener("pointermove",function(e){
    if(drag){ var dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; svg.classList.add("drag"); }
      if(moved) setVB({x:drag.vb.x-dx*drag.s, y:drag.vb.y-dy*drag.s, w:drag.vb.w, h:drag.vb.h}); }
  });
  window.addEventListener("pointerup",function(){ if(drag && moved) schedPaint(); drag=null; svg.classList.remove("drag"); });
  svg.addEventListener("mousemove",function(e){
    var t=e.target.closest(".prov"); if(!t || drag&&moved){ tip.style.opacity=0; return; }
    var i=+t.dataset.i, s=STAT[i], r=card.getBoundingClientRect();
    tip.innerHTML='<b>'+esc(NEW[i][0])+'</b> <span class="m">· '+REGION[NEW[i][1]]+'</span><br>'+
      (NEW[i][2].length>1||NEW[i][2][0]!==NEW[i][0] ? '<span class="m">Gồm: '+esc(NEW[i][2].join(", "))+'</span><br>' : '')+
      (s.n ? (F.res==="win"?'Gói trúng: ':'Gói tham dự: ')+'<b>'+s.n+'</b> · '+Object.keys(s.hosp).length+' cơ sở<br>Giá trị: <b>'+vnd(s.v)+'</b>'+
        (s.hvN&&s.icN?'<br><span class="m">Hùng Vĩ '+s.hvN+' · iCare '+s.icN+'</span>':'')+(s.soon?'<br><span style="color:#FFD08A">'+s.soon+' hợp đồng sắp hết hạn</span>':'')
        : '<span class="m">Chưa có gói '+(F.res==="win"?"trúng":"tham dự")+' trong kỳ lọc</span>');
    var x=e.clientX-r.left+14, y=e.clientY-r.top+14; if(x>r.width-270) x-=290; if(y>r.height-120) y-=130;
    tip.style.left=x+"px"; tip.style.top=y+"px"; tip.style.opacity=1;
  });
  svg.addEventListener("mouseleave",function(){ tip.style.opacity=0; });
  svg.addEventListener("click",function(e){
    if(moved) return;
    var b=e.target.closest(".bub"); if(b){ selOld = (selOld===b.dataset.o) ? null : b.dataset.o; paintBubbles(); renderSide(); return; }
    var t=e.target.closest(".prov"); if(!t){ return; }
    selectProv(+t.dataset.i);
  });
  document.getElementById("zin").onclick=function(){ zoomBy(1/1.4); };
  document.getElementById("zout").onclick=function(){ zoomBy(1.4); };
  document.getElementById("zhome").onclick=function(){ selectProv(-1); };
  window.addEventListener("resize",function(){ var was=(sel<0 && Math.abs(vb.w-VB0.w)<1); VB0=homeBox(); if(was) setVB(VB0); });
  window.addEventListener("keydown",function(e){ if(e.key==="Escape" && sel>=0) selectProv(-1); });
  window.addEventListener("resize",function(){ if(sel>=0) setVB(fitBox(PROV[sel].info.bb)); schedPaint(); });
}
function selectProv(i){
  sel=i; selOld=null;
  var c=document.getElementById("crumb");
  if(i<0){ c.innerHTML="<b>Toàn quốc</b>"; animateTo(VB0); }
  else {
    c.innerHTML='<a id="cr-home">Toàn quốc</a> › <b>'+esc(NEW[i][0])+'</b>';
    document.getElementById("cr-home").onclick=function(){ selectProv(-1); };
    animateTo(fitBox(PROV[i].info.bb));
  }
  paintMap(); renderSide();
  try{ history.replaceState(null,"", i<0 ? location.pathname+location.search : "#"+encodeURIComponent(NEW[i][0])); }catch(_){}

var SB=document.getElementById("sb"), openHosp={}, query="";
function statusTag(p){
  if(p.res!=="Win") return '<span class="st '+(p.res==="Fail"?"fail":p.res==="Cancel"?"mute":"pend")+'">'+({Fail:"Trượt",Cancel:"Huỷ",Pending:"Chờ kết quả"}[p.res]||p.res||"—")+'</span>';
  var m={ok:["ok","Đang thực hiện"],warn:["warn","Sắp hết hạn"],bad:["bad","Đã hết hạn"],na:["mute","Chưa có ngày phê duyệt"]}[p.status];
  return '<span class="st '+m[0]+'">'+m[1]+'</span>';
}
function timeline(p){
  if(p.res!=="Win" || !p.approve) return "";
  var tot=monthsBetween(p.approve,p.end), done=Math.max(0,Math.min(tot,monthsBetween(p.approve,NOW)));
  var pct=tot>0? done/tot*100 : 100, col={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--mute)"}[p.status]||"var(--sky)";
  var left=monthsBetween(NOW,p.end);
  return '<div class="tl" title="Đã thực hiện '+Math.round(pct)+'%"><i style="width:'+pct.toFixed(1)+'%;background:'+col+'"></i></div>'+
    '<div class="tld"><span>'+d2(p.approve)+'</span><span>'+(left>0? "còn "+(left>=1? Math.round(left)+" tháng" : Math.round(left*30.44)+" ngày") : "hết hạn "+Math.round(-left)+" tháng trước")+'</span><span>'+d2(p.end)+'</span></div>';
}

    (p.note?'<div class="meta" style="margin-top:4px">Ghi chú: '+esc(p.note)+'</div>':'')+
    (p.link?'<div class="meta" style="margin-top:4px"><a href="'+esc(p.link)+'" target="_blank" rel="noopener">Mở hồ sơ</a></div>':'')+
  '</div>';

function hospList(list){
  var q=nk(query);
  if(q) list=list.filter(function(p){ return nk(p.hospital+" "+p.tender+" "+p.tbmtRaw.join(" ")+" "+p.items.map(function(i){return i.code;}).join(" ")).indexOf(q)>=0; });
  var by={}, order=[];
  list.forEach(function(p){ var k=nk(p.hospital); if(!by[k]){ by[k]={name:p.hospital, old:p.oi, list:[], v:0}; order.push(k); } by[k].list.push(p); by[k].v+=pkgValue(p); });
  order.sort(function(a,b){ return by[b].v-by[a].v; });

  return order.map(function(k){
    var h=by[k], open = openHosp[k] || order.length<=3;

function kpiBlock(list){

    '<div class="kpi"><b>'+list.length+'</b><span>'+(win?"Gói trúng thầu":"Gói tham dự")+'</span></div>'+

    '<div class="kpi"><b>'+ok+'</b><span>Hợp đồng đang chạy</span></div>'+

function monthChart(list){
  var ks=[]; var y=2025, m=9; while(y*100+m <= Math.max(NOWK, 202508)){ ks.push(y*100+m); m++; if(m>12){m=1;y++;} }
  if(F.fy!=="all"){ ks=ks.filter(function(k){ return fyOf(k)===+F.fy; }); }
  if(F.q){ ks=ks.filter(function(k){ return qOf(k)===F.q; }); }
  var d={}; ks.forEach(function(k){ d[k]={HUNGVI:0,ICARE:0}; });
  list.forEach(function(p){ if(d[p.sk]) d[p.sk][p.npp]+=pkgValue(p); });
  var max=Math.max.apply(null, ks.map(function(k){ return d[k].HUNGVI+d[k].ICARE; }).concat([1]));
  return '<div class="monwrap"><div class="mon" role="img" aria-label="Giá trị trúng thầu theo tháng phê duyệt">'+ks.map(function(k,i){
    var a=d[k].HUNGVI/max*82, b=d[k].ICARE/max*82, fy=(k%100)===9||i===0;
    var tt=String(k%100).padStart(2,"0")+"/"+Math.floor(k/100)+" — Hùng Vĩ "+vnd(d[k].HUNGVI)+" · iCare "+vnd(d[k].ICARE);
    return '<div class="c'+(fy?" fy":"")+(k===NOWK?" now":"")+'" title="'+tt+'">'+

function fyRange(fy,q){

  if(!q) return "09/"+y0+" – 08/"+(y0+1);

  return String(m0).padStart(2,"0")+"/"+yA+" – "+String(m1).padStart(2,"0")+"/"+yB;
}

function jsonp(url, ms){
  return new Promise(function(res, rej){
    var cb="__wm"+Math.random().toString(36).slice(2), s=document.createElement("script"), done=false;
    var to=setTimeout(function(){ fin(); rej(new Error("hết giờ")); }, ms||30000);
    function fin(){ done=true; clearTimeout(to); try{ delete window[cb]; }catch(_){ window[cb]=undefined; } s.remove(); }
    window[cb]=function(d){ if(done) return; fin(); res(d); };
    s.onerror=function(){ if(done) return; fin(); rej(new Error("không tải được")); };
    s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb; document.head.appendChild(s);
  });
}
function getJSON(url){
  var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 30000);
  return fetch(url,{redirect:"follow", signal: ctl? ctl.signal : undefined}).then(function(r){ clearTimeout(to); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(){ clearTimeout(to); return jsonp(url, 30000); });
}
function loadOne(k){
  return getJSON(NPP[k].url+"?action=winMap&from=202509").then(function(d){
    if(d && d.ok && d.v && Array.isArray(d.rows)) return { rows:d.rows, meta:{exported:d.exported, sheet:d.sheet} };
    // máy chủ chưa có action=winMap ⇒ trả feed mặc định (chỉ dao)
    if(d && Array.isArray(d.rows)) return { rows:d.rows, meta:{exported:(d.meta&&d.meta.exported)||"", lite:true} };
    throw new Error((d&&d.error)||"dữ liệu lạ");
  });
}
function load(force){
  var ld=document.getElementById("load"); ld.style.display=""; ld.textContent="Đang đọc dữ liệu 2 NPP…";
  var errs=[];
  return Promise.all(["HUNGVI","ICARE"].map(function(k){
    return loadOne(k).then(function(r){ RAW[k]=r.rows; META[k]=r.meta; }).catch(function(e){ errs.push(NPP[k].name+" ("+e.message+")"); });
  })).then(function(){
    META.cached=null;
    LOADERR = errs.length ? "Không đọc được: "+errs.join(", ")+". Thử Tải lại sau ít phút." : "";
    if(!errs.length){ try{ localStorage.setItem(LS_KEY, JSON.stringify({at:new Date().toLocaleString("vi-VN"), RAW:RAW, META:{HUNGVI:META.HUNGVI,ICARE:META.ICARE}})); }catch(_){} }
    ld.style.display="none";
    rebuild();
  });
}
function rebuild(){ buildPackages(); refresh(); }
function refresh(){ computeStats(); paintMap(); renderSide(); }

try{ if(localStorage.getItem(LS_KEY+"_old")==="0") G.old.classList.add("off"); }catch(_){}
try{

  if(c && c.RAW){ RAW=c.RAW; META.HUNGVI=c.META.HUNGVI; META.ICARE=c.META.ICARE; META.cached=c.at; document.getElementById("load").style.display="none"; }

});
document.getElementById("reload").onclick=function(){ load(true); };
window.WINMAP={ pkgs:function(){ return PKGS; }, select:selectProv, F:F, refresh:refresh };
})();
