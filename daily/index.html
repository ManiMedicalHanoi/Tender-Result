<!DOCTYPE html>

<body>
<div id="app">
  <header class="mast" id="mast">
    <div class="mast-top">
      <span id="m-date"></span>
      <span class="mast-mid" id="m-no"></span>
      <span class="mast-r"><button class="lang" id="lang" type="button" aria-label="Đổi ngôn ngữ tiêu đề">EN · VI</button></span>
    </div>
    <a class="logo" href="#/" aria-label="MMH Daily — trang nhất">MMH Daily</a>

      <a href="#/" data-r="front">Trang nhất</a>
      <a href="#/s/health" data-r="health">Y tế</a>
      <a href="#/s/economy" data-r="economy">Kinh tế</a>

      <a href="#/docs" data-r="docs">Văn bản</a>

    </nav>

  <main id="view" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>

<div class="mini" id="mini" hidden>

  <button class="mini-btn" id="mini-back" type="button" aria-label="Lùi 15 giây"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="Inter" font-weight="700">15</text></svg></button>

  <button class="mini-btn" id="mini-fwd" type="button" aria-label="Tới 15 giây"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z" fill="currentColor"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="Inter" font-weight="700">15</text></svg></button>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
