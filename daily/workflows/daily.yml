# MMH Daily — chạy mỗi sáng 05:45 giờ Việt Nam: gom tin ⇒ dựng số báo ⇒ tạo podcast ⇒ lưu dữ liệu ⇒ MP3 lên Releases ⇒ đăng GitHub Pages.
# Đặt file này ở .github/workflows/daily.yml của kho riêng. Cần: Settings ▸ Pages ▸ Source = "GitHub Actions".
# Tuỳ chọn: secret ANTHROPIC_API_KEY ⇒ Claude viết song ngữ, phân tích y tế, kịch bản podcast đa dạng.
name: MMH Daily
on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      show: { description: 'Ép chương trình (briefing, twotakes, healthdesk, markets, editor, explainer, weekly) — để trống = theo lịch', required: false }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: mmh-daily, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cài ffmpeg + giọng đọc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts
      - name: Cài thư viện Claude (khi có khoá)
        if: env.HAS_KEY == 'true'
        run: npm i --no-save --no-audit --no-fund @anthropic-ai/sdk >/dev/null
      - name: Kho tin mấy ngày gần nhất (đệm, không lưu vào git)
        uses: actions/cache@v4
        with: { path: data/pool.json, key: 'pool-${{ github.run_id }}', restore-keys: 'pool-' }
      - name: Gom tin
        run: node tools/collect.mjs
      - name: Dựng số báo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_SHOW: ${{ inputs.show }}
        run: node tools/edition.mjs
      - name: Tạo podcast
        run: python3 tools/audio.py
      - name: MP3 lên Releases + lưu dữ liệu
        run: |
          D=$(ls data/editions | sort | tail -1 | sed 's/.json//')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/ep-$D/$D.mp3"
          node -e "const f='data/editions/$D.json',fs=require('fs'),e=JSON.parse(fs.readFileSync(f));if(e.podcast.audio)e.podcast.audio.alt='$URL';fs.writeFileSync(f,JSON.stringify(e))"
          gh release delete "ep-$D" -y --cleanup-tag 2>/dev/null || true
          gh release create "ep-$D" "audio/$D.mp3" --title "MMH Daily $D" --notes "Podcast $D" --latest=false
          git config user.name "mmh-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -qm "Số báo $D"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Dựng trang (kèm MP3 21 ngày gần nhất)
        run: |
          mkdir -p _site/audio
          cp -r index.html app.css app.js sw.js manifest.webmanifest icons data _site/
          rm -f _site/data/pool.json
          cp audio/*.mp3 _site/audio/ 2>/dev/null || true
          for d in $(ls data/editions | sort -r | head -21 | sed 's/.json//'); do
            [ -f "_site/audio/$d.mp3" ] || gh release download "ep-$d" -p "$d.mp3" -D _site/audio 2>/dev/null || true
          done
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
